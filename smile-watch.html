<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>笑顔ウォッチ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- フォントは script 側で読み込む。vendor/ に同梱があればそちらを使い、外部へは一切出ない -->

<style>
  :root{
    --paper:#EEECF3;
    --surface:#F9F8FC;
    --line:#D6D2E0;
    --ink:#23212B;
    --ink-soft:#6B6579;
    --cool:#6E63A6;
    --warm:#F0A93B;
    --wake:#3E8E7E;
    --drowsy:#C4574E;
    --idle:#C8C4D2;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
    line-height:1.7;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 20px 40px;
  }
  .app{width:100%;max-width:880px;}

  header{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding-bottom:18px;border-bottom:1px solid var(--line);
  }
  h1{
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;
    font-size:20px;margin:0;letter-spacing:.04em;
  }
  h2{
    font-family:"Zen Maru Gothic",sans-serif;font-weight:500;
    font-size:14px;margin:0;letter-spacing:.04em;
  }
  .status{
    display:flex;align-items:center;gap:8px;
    font-size:13px;color:var(--ink-soft);margin-left:auto;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:var(--idle);}
  .dot.live{background:var(--warm);box-shadow:0 0 0 4px rgba(240,169,59,.2);}
  .dot.wait{background:var(--cool);}
  .dot.error{background:#C4574E;}
  button{
    font-family:inherit;font-size:14px;font-weight:500;
    padding:9px 20px;border-radius:999px;cursor:pointer;
    border:1px solid var(--ink);background:var(--ink);color:var(--surface);
    transition:opacity .15s;
  }
  button:hover{opacity:.85;}
  button:disabled{opacity:.4;cursor:default;}
  button.off{background:transparent;color:var(--ink);}
  button.small{font-size:13px;padding:7px 15px;}
  button.danger{border-color:#B8756E;color:#A8433B;}
  button:focus-visible{outline:2px solid var(--cool);outline-offset:3px;}

  .cards{
    padding:30px 0 4px;display:grid;gap:26px;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  }
  .score{
    font-family:"M PLUS 1 Code",monospace;font-weight:200;
    font-size:clamp(56px,10vw,88px);line-height:1;
    letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  }
  .score .unit{font-size:.3em;margin-left:.15em;color:var(--ink-soft);}
  .score-label{margin:6px 0 18px;font-size:13px;color:var(--ink-soft);}

  .ribbon-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;}
  canvas{display:block;width:100%;height:88px;border-radius:6px;}
  .axis{
    display:flex;justify-content:space-between;
    font-family:"M PLUS 1 Code",monospace;font-size:11px;
    color:var(--ink-soft);padding-top:8px;
  }

  .subs{
    margin:12px 0 0;display:grid;gap:2px;
    grid-template-columns:repeat(3,1fr);
  }
  .subs div{display:grid;gap:1px;}
  .subs dt{font-size:11px;color:var(--ink-soft);}
  .subs dd{
    margin:0;font-family:"M PLUS 1 Code",monospace;font-size:13px;
    font-variant-numeric:tabular-nums;
  }
  .subs .base{display:block;font-size:10px;color:var(--ink-soft);}

  .cheer{
    margin-top:20px;padding:20px 24px;border-radius:var(--radius);
    background:linear-gradient(100deg,#FBF3E4,#F3EFFA);
    border:1px solid #E6DCC9;
  }
  .cheer.wake{
    background:linear-gradient(100deg,#F7E8E6,#EDF3F1);
    border-color:#E2CBC7;
  }
  .cheer .tag{
    display:inline-block;font-size:11px;letter-spacing:.08em;
    color:var(--ink-soft);margin-bottom:4px;
  }
  .cheer p{
    margin:0;font-family:"Zen Maru Gothic",sans-serif;font-weight:500;
    font-size:clamp(17px,2.4vw,21px);line-height:1.75;
  }
  .cheer[hidden]{display:none;}
  .cheer.enter{animation:rise .5s ease-out;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.cheer.enter{animation:none;}}

  .panel{
    margin-top:26px;display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start;
    border-top:1px solid var(--line);padding-top:22px;
  }
  video{
    width:160px;aspect-ratio:4/3;object-fit:cover;border-radius:10px;
    background:#DAD6E2;transform:scaleX(-1);
  }
  .controls{flex:1;min-width:240px;display:grid;gap:16px;}
  .field{display:grid;gap:6px;}
  .field label{font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between;}
  .field b{font-family:"M PLUS 1 Code",monospace;font-weight:400;color:var(--ink);}
  input[type=range]{width:100%;accent-color:var(--cool);}
  select{
    font-family:inherit;font-size:14px;padding:7px 10px;
    border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);
  }

  .review{
    margin-top:26px;border-top:1px solid var(--line);padding-top:22px;
  }
  .review-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .legend{
    margin-left:auto;display:flex;align-items:center;gap:14px;
    font-size:11px;color:var(--ink-soft);
  }
  .legend i{
    display:inline-block;width:9px;height:9px;border-radius:2px;
    margin-right:5px;vertical-align:-1px;
  }
  .legend .sw-wake{background:var(--wake);}
  .legend .sw-smile{background:var(--warm);}
  .review .cards{padding:16px 0 0;gap:22px;}
  canvas.chart{height:118px;}

  .record{
    margin-top:26px;border-top:1px solid var(--line);padding-top:22px;
  }
  .record-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .record-head .count{
    font-family:"M PLUS 1 Code",monospace;font-size:12px;color:var(--ink-soft);
    margin-left:auto;font-variant-numeric:tabular-nums;
  }
  .record-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

  .note{margin-top:22px;font-size:12px;color:var(--ink-soft);}
  .note.tight{margin-top:12px;}
  .note.alert{color:#A8433B;}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>笑顔ウォッチ</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">停止中</span></div>
    <button id="toggleBtn">見守りを始める</button>
  </header>

  <section class="cards">
    <article>
      <div class="score"><span id="smileValue">--</span><span class="unit">%</span></div>
      <p class="score-label">直近1分の笑顔スコア</p>
      <div class="ribbon-wrap">
        <canvas id="smileRibbon"></canvas>
        <div class="axis"><span>5分前</span><span>いま</span></div>
      </div>
    </article>

    <article>
      <div class="score"><span id="wakeValue">--</span><span class="unit">/100</span></div>
      <p class="score-label">直近1分の覚醒スコア</p>
      <div class="ribbon-wrap">
        <canvas id="wakeRibbon"></canvas>
        <div class="axis"><span>5分前</span><span>いま</span></div>
      </div>
      <dl class="subs">
        <div>
          <dt>PERCLOS</dt>
          <dd id="perclosOut">--<span class="base" id="perclosBase">基準 --</span></dd>
        </div>
        <div>
          <dt>開瞼ゆらぎ</dt>
          <dd id="fluctOut">--<span class="base" id="fluctBase">基準 --</span></dd>
        </div>
        <div>
          <dt>左右差</dt>
          <dd id="asymOut">--<span class="base" id="asymBase">基準 --</span></dd>
        </div>
      </dl>
    </article>
  </section>

  <section class="cheer" id="cheer" aria-live="polite" hidden>
    <span class="tag" id="cheerTag"></span>
    <p id="cheerText"></p>
  </section>

  <section class="panel">
    <video id="video" playsinline muted></video>
    <div class="controls">
      <div class="field">
        <label for="smileThreshold">笑顔のしきい値 <b id="smileThresholdOut">20</b></label>
        <input type="range" id="smileThreshold" min="5" max="60" step="1" value="20">
      </div>
      <div class="field">
        <label for="wakeThreshold">覚醒のしきい値 <b id="wakeThresholdOut">45</b></label>
        <input type="range" id="wakeThreshold" min="20" max="80" step="1" value="45">
      </div>
      <div class="field">
        <label for="duration">判定時間</label>
        <select id="duration">
          <option value="30">30秒つづいたら</option>
          <option value="60">60秒つづいたら</option>
          <option value="90" selected>90秒つづいたら</option>
          <option value="120">120秒つづいたら</option>
        </select>
      </div>
      <div>
        <button id="calibrateBtn" class="off small" disabled>いまの状態を基準にする</button>
      </div>
    </div>
  </section>

  <section class="review">
    <div class="review-head">
      <h2>振り返り</h2>
      <span class="legend"><span><i class="sw-wake"></i>覚醒</span><span><i class="sw-smile"></i>笑顔</span></span>
      <button id="reviewBtn" class="off small">更新</button>
    </div>
    <div class="cards">
      <article>
        <p class="score-label">日ごとの平均（直近14日）</p>
        <div class="ribbon-wrap">
          <canvas id="dayChart" class="chart"></canvas>
          <div class="axis" id="dayAxis"></div>
        </div>
      </article>
      <article>
        <p class="score-label">時間帯別の平均</p>
        <div class="ribbon-wrap">
          <canvas id="hourChart" class="chart"></canvas>
          <div class="axis" id="hourAxis"><span>0時</span><span>6時</span><span>12時</span><span>18時</span><span>23時</span></div>
        </div>
      </article>
    </div>
    <p class="note tight" id="reviewSummary">まだ振り返るだけの記録がありません。</p>
  </section>

  <section class="record">
    <div class="record-head">
      <h2>記録</h2>
      <span class="count" id="logCount">0 件</span>
    </div>
    <div class="record-actions">
      <select id="exportRange" aria-label="書き出す範囲">
        <option value="all" selected>すべて</option>
        <option value="today">今日</option>
        <option value="7">過去7日</option>
      </select>
      <button id="csvBtn" class="off small" disabled>CSVで書き出す</button>
      <button id="jsonBtn" class="off small" disabled>JSONで書き出す</button>
      <button id="clearBtn" class="off small danger" disabled>記録を消す</button>
    </div>
    <p class="note tight" id="recordNote">記録はこのブラウザに保存されます。書き出されるのは数値だけで、映像や画像は含まれません。</p>
  </section>

  <p class="note" id="note">映像はこのパソコンの中だけで処理します。録画も送信もしません。</p>
</div>

<script type="module">
/* ---------- 定数 ---------- */
const APP_VERSION = "3.0";
const SAMPLE_MS   = 200;      // サンプリング間隔（5fps）
const WINDOW_MS   = 60_000;   // 表示スコアの移動平均窓
const WARMUP_MS   = 30_000;   // 判定開始までのウォームアップ
const ABSENT_MS   = 10_000;   // 不在とみなすまでの時間
const COOLDOWN_MS = 300_000;  // 励ましのクールダウン
const COL_W       = 3;        // リボン1本の幅(px) = 1秒

// 記録の保存（IndexedDB）
const DB_NAME     = "smile-watch";
const DB_VERSION  = 1;
const RETENTION_DAYS = 30;    // これより古い記録は起動時に捨てる
const FLUSH_MS    = 5_000;    // 書き込みをまとめる間隔

// 解析アセット。vendor/manifest.json があればそちらを使い、なければ CDN から取る
const VENDOR_MANIFEST = "vendor/manifest.json";
const VENDOR_FONTS    = "vendor/fonts.css";
const CDN = {
  bundle:"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs",
  wasm:  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm",
  model: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
  fonts: "https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&family=M+PLUS+1+Code:wght@200;400&display=swap"
};

// 覚醒スコアの算出パラメータ
const CLOSED_AT   = 0.20;     // 開瞼度がこれ未満なら閉眼（PERCLOS P80 相当）
const OPEN_PHASE  = 0.50;     // 開瞼中とみなす下限（まばたきを除外する）
const MIN_FACE    = 60;       // 覚醒スコアを出すのに必要な有効サンプル数（12秒分）
const MIN_OPEN    = 30;       // ゆらぎ・左右差を出すのに必要な開瞼サンプル数
const DEFAULT_BASE = { perclos:0.05, fluct:0.015, asym:0.015 };  // 基準を取る前の暫定値
const SPAN = { perclos:0.35, fluct:0.14, asym:0.12 };  // 基準からこれだけ離れたら減点満点
const WEIGHT = { perclos:0.5, fluct:0.3, asym:0.2 };

const MESSAGES = {
  smile:[
    "ひと息いれよう。肩を下ろして、深呼吸をひとつ。",
    "いい調子。ここまで進んだのは、あなたの手です。",
    "窓の外を10秒だけ見てみる。目も気持ちもゆるみます。",
    "完璧じゃなくていい。今日の分は今日の分。",
    "水を一杯どうぞ。体が軽くなると、顔もゆるみます。",
    "難しい顔になっていました。いちど立ち上がってみませんか。",
    "うまくいかない時間も、ちゃんと進んでいる時間です。",
    "口角を1ミリ上げるだけで、脳は少しだまされます。ためしに。"
  ],
  wake:[
    "まぶたが重くなってきています。少し目を閉じて休みませんか。",
    "眠気のサインが出ています。席を立って、水を一杯どうぞ。",
    "短い休憩や仮眠をとれるなら、いまがその頃合いかもしれません。",
    "画面から目を離して、遠くを20秒だけ見つめてみてください。",
    "明るい場所へ移ってみるのは、どうでしょう。",
    "背筋を伸ばして、肩を大きく回してみましょう。",
    "窓を開けて、外の空気を入れてみませんか。",
    "無理に押し切らず、いちど休憩を挟みましょう。"
  ]
};
const CHEER_TAG = { smile:"笑顔", wake:"覚醒" };

/* ---------- 要素 ---------- */
const video = document.getElementById("video");
const dot = document.getElementById("dot");
const statusText = document.getElementById("statusText");
const toggleBtn = document.getElementById("toggleBtn");
const smileValue = document.getElementById("smileValue");
const wakeValue = document.getElementById("wakeValue");
const cheer = document.getElementById("cheer");
const cheerTag = document.getElementById("cheerTag");
const cheerText = document.getElementById("cheerText");
const note = document.getElementById("note");
const smileThreshold = document.getElementById("smileThreshold");
const smileThresholdOut = document.getElementById("smileThresholdOut");
const wakeThreshold = document.getElementById("wakeThreshold");
const wakeThresholdOut = document.getElementById("wakeThresholdOut");
const durationInput = document.getElementById("duration");
const calibrateBtn = document.getElementById("calibrateBtn");
const perclosOut = document.getElementById("perclosOut");
const fluctOut = document.getElementById("fluctOut");
const asymOut = document.getElementById("asymOut");
const perclosBase = document.getElementById("perclosBase");
const fluctBase = document.getElementById("fluctBase");
const asymBase = document.getElementById("asymBase");
const logCount = document.getElementById("logCount");
const recordNote = document.getElementById("recordNote");
const reviewBtn = document.getElementById("reviewBtn");
const reviewSummary = document.getElementById("reviewSummary");
const dayAxis = document.getElementById("dayAxis");
const exportRange = document.getElementById("exportRange");
const csvBtn = document.getElementById("csvBtn");
const jsonBtn = document.getElementById("jsonBtn");
const clearBtn = document.getElementById("clearBtn");

const ribbons = {
  smile:{ canvas:document.getElementById("smileRibbon"), ctx:null, columns:[], color:smileColor },
  wake: { canvas:document.getElementById("wakeRibbon"),  ctx:null, columns:[], color:wakeColor  }
};
for(const r of Object.values(ribbons)) r.ctx = r.canvas.getContext("2d");

const charts = {
  day:  { canvas:document.getElementById("dayChart"),  ctx:null, items:[] },
  hour: { canvas:document.getElementById("hourChart"), ctx:null, items:[] }
};
for(const c of Object.values(charts)) c.ctx = c.canvas.getContext("2d");

/* ---------- 状態 ---------- */
let landmarker = null;
let stream = null;
let running = false;
let samples = [];        // 直近60秒 {t, face, smile, openL, openR}
let secondBuf = [];      // 1秒分のバッファ
let lastSample = 0, lastColumn = 0, lastFaceAt = 0, startedAt = 0, startedWall = 0;
let baseline = null;     // {perclos, fluct, asym}
let lowSince = { smile:null, wake:null };
let lastCheerAt = -Infinity;   // performance.now() は読み込みからの経過msなので 0 だと初回が抑制される
let lastMessage = { smile:-1, wake:-1 };
let cheerTimer = null;

let sessionNo = 0;
let db = null;                 // IndexedDB。開けなければ null（その回だけメモリで持つ）
let pendingRows = [];          // まだ書き込んでいない行
let pendingEvents = [];
let flushTimer = null;
let stored = { rows:0, from:null, to:null };   // 書き込み済みの件数と期間
let assetSource = null;        // "local" | "cdn"

smileThreshold.addEventListener("input", () => smileThresholdOut.textContent = smileThreshold.value);
wakeThreshold.addEventListener("input", () => wakeThresholdOut.textContent = wakeThreshold.value);
for(const el of [smileThreshold, wakeThreshold, durationInput]) el.addEventListener("change", saveSettings);
reviewBtn.addEventListener("click", refreshReview);
toggleBtn.addEventListener("click", () => running ? stop() : start());
calibrateBtn.addEventListener("click", () => calibrate(true));
csvBtn.addEventListener("click", exportCsv);
jsonBtn.addEventListener("click", exportJson);
clearBtn.addEventListener("click", clearLog);
exportRange.addEventListener("change", updateRecordUi);
window.addEventListener("resize", resizeAll);
// タブを閉じる・隠れるときに、書き込み待ちの分を取りこぼさない
window.addEventListener("pagehide", () => flush());
document.addEventListener("visibilitychange", () => { if(document.hidden) flush(); });
window.addEventListener("beforeunload", (e) => {
  // 保存できていれば閉じても失われない。保存先が無いときだけ引き止める。
  if(!db && (pendingRows.length || pendingEvents.length)){
    e.preventDefault();
    e.returnValue = "";
  }
});

resizeAll();
loadFonts();
init();

async function init(){
  db = await openDb();
  if(db){
    await prune();
    await refreshStored();
  }
  sessionNo = await metaGet("session", 0);
  await loadSettings();
  recordNote.textContent = db
    ? `記録はこのブラウザに保存され、${RETENTION_DAYS} 日分を残します。書き出されるのは数値だけで、映像や画像は含まれません。`
    : "このブラウザでは記録を保存できないため、タブを閉じると消えます（プライベートウィンドウなどでは保存できません）。";
  updateRecordUi();
  await refreshReview();
}

/* ---------- 設定の保存 ---------- */
async function loadSettings(){
  const saved = await metaGet("settings", null);
  if(saved){
    if(saved.smile    !== undefined) smileThreshold.value = saved.smile;
    if(saved.wake     !== undefined) wakeThreshold.value = saved.wake;
    if(saved.duration !== undefined) durationInput.value = saved.duration;
  }
  smileThresholdOut.textContent = smileThreshold.value;
  wakeThresholdOut.textContent = wakeThreshold.value;
}

function saveSettings(){
  metaSet("settings", {
    smile:Number(smileThreshold.value),
    wake:Number(wakeThreshold.value),
    duration:durationInput.value
  });
}

/* ---------- 開始 / 停止 ---------- */
async function start(){
  toggleBtn.disabled = true;
  setStatus("wait", "読み込み中");
  try{
    if(!landmarker) landmarker = await loadModel();
    stream = await navigator.mediaDevices.getUserMedia({ video:{ width:640, height:480 } });
    video.srcObject = stream;
    await video.play();
  }catch(err){
    setStatus("error", "開始できません");
    note.className = "note alert";
    note.textContent = describeError(err);
    toggleBtn.disabled = false;
    stopStream();
    return;
  }
  note.className = "note";
  note.textContent = privacyNote();
  running = true;
  samples = []; secondBuf = [];
  for(const r of Object.values(ribbons)) r.columns = [];
  baseline = null;
  showBaseline();
  startedAt = performance.now();
  startedWall = Date.now();
  lastColumn = startedAt; lastFaceAt = startedAt;
  lowSince = { smile:null, wake:null };
  lastCheerAt = -Infinity;
  sessionNo += 1;
  metaSet("session", sessionNo);   // 再読み込みしても番号が続くようにする
  addEvent(startedAt, "start", { session:sessionNo });
  toggleBtn.disabled = false;
  toggleBtn.textContent = "見守りを止める";
  toggleBtn.classList.add("off");
  calibrateBtn.disabled = false;
  setStatus("live", "見守り中");
  requestAnimationFrame(loop);
}

function stop(){
  if(running){
    addEvent(performance.now(), "stop", { session:sessionNo });
    // 直前まで計測していた分も含めて振り返りを作り直す
    flush().then(refreshReview);
  }
  running = false;
  stopStream();
  toggleBtn.textContent = "見守りを始める";
  toggleBtn.classList.remove("off");
  calibrateBtn.disabled = true;
  setStatus("", "停止中");
  smileValue.textContent = "--";
  wakeValue.textContent = "--";
  showMetrics(null);
  hideCheer();
}

function stopStream(){
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
}

/* ---------- 解析アセット ----------
   npm run fetch-assets を実行すると vendor/ に一式が置かれ、以後は外部と通信しない。
   置かれていなければ従来どおり CDN から取る。                                    */
async function vendored(){
  try{
    const res = await fetch(VENDOR_MANIFEST, { cache:"no-store" });
    if(!res.ok) return null;
    const m = await res.json();
    return m?.bundle && m?.wasm && m?.model ? m : null;
  }catch{
    return null;    // vendor/ が無いだけ。CDN で続行する
  }
}

async function loadFonts(){
  let href = CDN.fonts;
  try{
    const res = await fetch(VENDOR_FONTS, { method:"HEAD", cache:"no-store" });
    if(res.ok) href = VENDOR_FONTS;
  }catch{ /* 同梱なし。CDN を使う */ }
  const link = document.createElement("link");
  link.rel = "stylesheet";
  link.href = href;
  document.head.appendChild(link);
}

async function loadModel(){
  const local = await vendored();
  assetSource = local ? "local" : "cdn";
  const url = p => new URL(p, location.href).href;

  const { FaceLandmarker, FilesetResolver } = await import(local ? url(local.bundle) : CDN.bundle);
  const fileset = await FilesetResolver.forVisionTasks(local ? url(local.wasm) : CDN.wasm);
  const options = {
    baseOptions:{
      modelAssetPath: local ? url(local.model) : CDN.model,
      delegate:"GPU"
    },
    outputFaceBlendshapes:true,
    runningMode:"VIDEO",
    numFaces:1
  };
  try{
    return await FaceLandmarker.createFromOptions(fileset, options);
  }catch{
    options.baseOptions.delegate = "CPU";     // GPU が使えない環境へのフォールバック
    return await FaceLandmarker.createFromOptions(fileset, options);
  }
}

function privacyNote(){
  return assetSource === "local"
    ? "映像はこのパソコンの中だけで処理します。解析モデルも同梱のものを使うため、外部との通信はありません。"
    : "映像はこのパソコンの中だけで処理します。録画も送信もしません。解析モデルは初回のみ CDN から取得します。";
}

/* ---------- 計測ループ ---------- */
function loop(){
  if(!running) return;
  const now = performance.now();
  if(now - lastSample >= SAMPLE_MS && video.readyState >= 2){
    lastSample = now;
    const sample = readFrame(now);
    samples.push(sample);
    secondBuf.push(sample);
    while(samples.length && now - samples[0].t > WINDOW_MS) samples.shift();
  }
  if(now - lastColumn >= 1000){
    lastColumn = now;
    tick(now);
    secondBuf = [];
  }
  requestAnimationFrame(loop);
}

function readFrame(now){
  const result = landmarker.detectForVideo(video, now);
  const shapes = result.faceBlendshapes?.[0]?.categories;
  if(!shapes) return { t:now, face:false, smile:null, openL:null, openR:null };
  const at = name => shapes.find(c => c.categoryName === name)?.score ?? 0;
  const smile = Math.min(100, (at("mouthSmileLeft") + at("mouthSmileRight")) / 2 * 100);
  // 開瞼度: eyeBlink ブレンドシェイプ（1=閉眼）を反転して 0..1 の開き具合にする
  const openL = clamp(1 - at("eyeBlinkLeft"), 0, 1);
  const openR = clamp(1 - at("eyeBlinkRight"), 0, 1);
  lastFaceAt = now;
  return { t:now, face:true, smile, openL, openR };
}

/* 1秒ごとの集計・描画・記録・判定 */
function tick(now){
  const faceSeen = secondBuf.some(s => s.face);
  const smileSecond = average(secondBuf.filter(s => s.face).map(s => s.smile));
  const smileNow = average(samples.filter(s => s.face).map(s => s.smile));

  const metrics = eyeMetrics(samples);
  if(!baseline && metrics && now - startedAt >= WARMUP_MS) calibrate(false, metrics);
  const wakeNow = metrics ? wakeScore(metrics) : null;

  smileValue.textContent = smileNow === null ? "--" : Math.round(smileNow);
  wakeValue.textContent  = wakeNow  === null ? "--" : wakeNow;
  showMetrics(metrics);

  pushColumn("smile", faceSeen ? smileSecond : null);
  pushColumn("wake",  faceSeen ? wakeNow : null);
  drawRibbon("smile");
  drawRibbon("wake");

  recordRow(now, { faceSeen, smileSecond, smileNow, wakeNow, metrics });
  judge(now, smileNow, wakeNow);
}

/* ---------- 覚醒度の推定 ----------
   NEC「顔映像からの眠気（覚醒度）推定技術」が挙げるまぶたの2特徴
   （開瞼状態の時間的ゆらぎ／左右まぶたの非同期＝左右差）と、
   古典的な PERCLOS（閉眼時間の割合）を組み合わせて 0–100 に丸めている。
   いずれも 5fps 程度の低フレームレートで捉えられる遅い変化。          */
function eyeMetrics(list){
  const faced = list.filter(s => s.face);
  if(faced.length < MIN_FACE) return null;

  const open = faced.map(s => (s.openL + s.openR) / 2);
  const perclos = open.filter(v => v < CLOSED_AT).length / open.length;

  // まばたきの瞬間を除いた「開瞼中」のサンプルだけでゆらぎと左右差を見る
  const opened = faced.filter(s => (s.openL + s.openR) / 2 >= OPEN_PHASE);
  let fluct = null, asym = null;
  if(opened.length >= MIN_OPEN){
    fluct = stdev(opened.map(s => (s.openL + s.openR) / 2));
    asym  = average(opened.map(s => Math.abs(s.openL - s.openR)));
  }
  return { perclos, fluct, asym, open:average(open), samples:faced.length };
}

function wakeScore(m){
  const base = baseline || DEFAULT_BASE;
  const penalty = key => {
    const value = m[key];
    // 開瞼サンプルが足りない＝ほぼ閉じている、とみなして減点を満点にする
    if(value === null || value === undefined) return 1;
    return clamp((value - base[key]) / SPAN[key], 0, 1);
  };
  const total =
    WEIGHT.perclos * penalty("perclos") +
    WEIGHT.fluct   * penalty("fluct")   +
    WEIGHT.asym    * penalty("asym");
  return Math.round(clamp(100 * (1 - total), 0, 100));
}

function calibrate(manual, metrics){
  const m = metrics || eyeMetrics(samples);
  if(!m || m.fluct === null){
    if(manual){
      note.className = "note alert";
      note.textContent = "基準を取れませんでした。カメラに顔が写った状態で、10秒ほどおいてからもう一度お試しください。";
    }
    return;
  }
  baseline = { perclos:m.perclos, fluct:m.fluct, asym:m.asym };
  // 基準が変わるとスコアの意味が変わるので、覚醒側の継続計測はいったん捨てて次のサンプルから取り直す
  lowSince.wake = null;
  showBaseline();
  addEvent(performance.now(), "baseline", { manual:!!manual, ...baseline });
  if(manual){
    note.className = "note";
    note.textContent = "いまの状態を平常時の基準にしました。覚醒スコアはここからの変化で判定します。";
  }
}

/* ---------- 判定 ---------- */
function judge(now, smileNow, wakeNow){
  if(now - lastFaceAt > ABSENT_MS){
    setStatus("wait", "一時停止（顔が見つかりません）");
    lowSince = { smile:null, wake:null };
    return;
  }
  setStatus("live", "見守り中");
  if(now - startedAt < WARMUP_MS) return;

  const held = kind => {
    const value = kind === "smile" ? smileNow : wakeNow;
    const limit = Number(kind === "smile" ? smileThreshold.value : wakeThreshold.value);
    if(value === null){ lowSince[kind] = null; return false; }
    if(value >= limit){ lowSince[kind] = null; return false; }
    if(lowSince[kind] === null) lowSince[kind] = now;
    return now - lowSince[kind] >= Number(durationInput.value) * 1000;
  };

  const wakeHeld = held("wake");
  const smileHeld = held("smile");
  if(now - lastCheerAt < COOLDOWN_MS) return;

  // 眠気のほうが急ぎなので優先する
  const kind = wakeHeld ? "wake" : (smileHeld ? "smile" : null);
  if(!kind) return;
  showCheer(kind, now);
  lastCheerAt = now;
  lowSince[kind] = null;
}

function showCheer(kind, now){
  const list = MESSAGES[kind];
  let index = Math.floor(Math.random() * list.length);
  if(index === lastMessage[kind]) index = (index + 1) % list.length;
  lastMessage[kind] = index;
  cheerTag.textContent = CHEER_TAG[kind];
  cheerText.textContent = list[index];
  cheer.classList.toggle("wake", kind === "wake");
  cheer.hidden = false;
  cheer.classList.remove("enter");
  void cheer.offsetWidth;
  cheer.classList.add("enter");
  clearTimeout(cheerTimer);
  cheerTimer = setTimeout(hideCheer, 20_000);
  addEvent(now, "cheer", { kind, message:list[index] });
}

function hideCheer(){
  clearTimeout(cheerTimer);
  cheer.hidden = true;
  cheer.classList.remove("enter");
}

/* ---------- 記録 ---------- */
function wallTime(now){
  return startedWall + (now - startedAt);
}

function recordRow(now, d){
  const m = d.metrics;
  pendingRows.push({
    session: sessionNo,
    epochMs: Math.round(wallTime(now)),
    elapsed: Math.round((now - startedAt) / 1000),
    face: d.faceSeen,
    smile: round(d.smileSecond, 1),
    smileAvg: round(d.smileNow, 1),
    wake: d.wakeNow,
    perclos: m ? round(m.perclos, 4) : null,
    fluct: m ? round(m.fluct, 4) : null,
    asym: m ? round(m.asym, 4) : null,
    eyeOpen: m ? round(m.open, 4) : null
  });
  scheduleFlush();
  updateRecordUi();
}

function addEvent(now, type, detail){
  pendingEvents.push({ epochMs:Math.round(wallTime(now)), type, ...detail });
  scheduleFlush();
  updateRecordUi();
}

/* ---------- IndexedDB ---------- */
function openDb(){
  return new Promise(resolve => {
    let req;
    try{ req = indexedDB.open(DB_NAME, DB_VERSION); }
    catch{ return resolve(null); }        // プライベートウィンドウなどで使えないことがある
    req.onupgradeneeded = () => {
      const d = req.result;
      for(const name of ["samples", "events"]){
        if(!d.objectStoreNames.contains(name)){
          d.createObjectStore(name, { autoIncrement:true }).createIndex("epochMs", "epochMs");
        }
      }
      if(!d.objectStoreNames.contains("meta")) d.createObjectStore("meta", { keyPath:"key" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => resolve(null);
    req.onblocked = () => resolve(null);
  });
}

function store(name, mode){ return db.transaction([name], mode).objectStore(name); }

function ask(request){
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror   = () => reject(request.error);
  });
}

function settled(transaction){
  return new Promise((resolve, reject) => {
    transaction.oncomplete = () => resolve();
    transaction.onerror    = () => reject(transaction.error);
    transaction.onabort    = () => reject(transaction.error);
  });
}

async function metaGet(key, fallback){
  if(!db) return fallback;
  try{
    const row = await ask(store("meta", "readonly").get(key));
    return row ? row.value : fallback;
  }catch{ return fallback; }
}

async function metaSet(key, value){
  if(!db) return;
  try{
    const t = db.transaction(["meta"], "readwrite");
    t.objectStore("meta").put({ key, value });
    await settled(t);
  }catch{ /* 保存できなくても計測は続ける */ }
}

function scheduleFlush(){
  if(!db || flushTimer) return;
  flushTimer = setTimeout(flush, FLUSH_MS);
}

// 書き込み待ちの行とイベントを 1 トランザクションで流し込む
async function flush(){
  clearTimeout(flushTimer);
  flushTimer = null;
  if(!db || (!pendingRows.length && !pendingEvents.length)) return;

  const rows = pendingRows, events = pendingEvents;
  pendingRows = []; pendingEvents = [];
  try{
    const t = db.transaction(["samples", "events"], "readwrite");
    const samples = t.objectStore("samples"), log = t.objectStore("events");
    for(const r of rows) samples.add(r);
    for(const e of events) log.add(e);
    await settled(t);
    stored.rows += rows.length;
    for(const r of rows){
      if(stored.from === null || r.epochMs < stored.from) stored.from = r.epochMs;
      if(stored.to   === null || r.epochMs > stored.to)   stored.to   = r.epochMs;
    }
  }catch{
    // 容量超過などで書けなかったぶんは戻す。次の flush で再挑戦する
    pendingRows = rows.concat(pendingRows);
    pendingEvents = events.concat(pendingEvents);
    scheduleFlush();
  }
  updateRecordUi();
}

async function prune(){
  const cutoff = Date.now() - RETENTION_DAYS * 86_400_000;
  for(const name of ["samples", "events"]){
    try{
      const t = db.transaction([name], "readwrite");
      const cursor = t.objectStore(name).index("epochMs").openCursor(IDBKeyRange.upperBound(cutoff, true));
      cursor.onsuccess = () => {
        const c = cursor.result;
        if(!c) return;
        c.delete();
        c.continue();
      };
      await settled(t);
    }catch{ /* 消せなくても支障はない */ }
  }
}

async function refreshStored(){
  try{
    // 3 つの要求を同じターンで出す。間に await を挟むとトランザクションが閉じてしまう
    const samples = store("samples", "readonly");
    const count = samples.count();
    const index = samples.index("epochMs");
    const oldest = index.openCursor(null, "next");
    const newest = index.openCursor(null, "prev");
    stored.rows = await ask(count);
    stored.from = (await ask(oldest))?.value.epochMs ?? null;
    stored.to   = (await ask(newest))?.value.epochMs ?? null;
  }catch{
    stored = { rows:0, from:null, to:null };
  }
}

async function readSince(name, fromMs){
  if(!db) return [];
  try{
    const s = store(name, "readonly");
    return await ask(fromMs === null ? s.getAll() : s.index("epochMs").getAll(IDBKeyRange.lowerBound(fromMs)));
  }catch{ return []; }
}

/* ---------- 振り返り ----------
   保存済みの行を集計して、日ごとと時間帯別の平均を出す。
   30 日ぶんは数十万行になりうるので、getAll で持ち上げずカーソルで足しながら進む。 */
const REVIEW_DAYS = 14;
const HOUR_MIN_SEC = 300;   // 平均を出すのに必要な計測秒数（5 分）

function startOfDay(ms){
  const d = new Date(ms);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

function emptyBucket(){ return { wake:0, wakeN:0, smile:0, smileN:0, sec:0 }; }

function addTo(bucket, row){
  bucket.sec++;
  if(typeof row.wake === "number"){ bucket.wake += row.wake; bucket.wakeN++; }
  if(typeof row.smileAvg === "number"){ bucket.smile += row.smileAvg; bucket.smileN++; }
}

function mean(sum, n){ return n ? sum / n : null; }

async function summarize(){
  if(!db) return null;
  const from = startOfDay(Date.now() - (REVIEW_DAYS - 1) * 86_400_000);
  const byDay = new Map();
  const byHour = Array.from({ length:24 }, emptyBucket);

  try{
    await new Promise((resolve, reject) => {
      const cursor = store("samples", "readonly").index("epochMs")
        .openCursor(IDBKeyRange.lowerBound(from));
      cursor.onsuccess = () => {
        const c = cursor.result;
        if(!c) return resolve();
        const row = c.value;
        if(row.face){
          const when = new Date(row.epochMs);
          const key = startOfDay(row.epochMs);
          if(!byDay.has(key)) byDay.set(key, emptyBucket());
          addTo(byDay.get(key), row);
          addTo(byHour[when.getHours()], row);
        }
        c.continue();
      };
      cursor.onerror = () => reject(cursor.error);
    });
  }catch{
    return null;
  }
  return { from, byDay, byHour };
}

async function refreshReview(){
  reviewBtn.disabled = true;
  try{
    const summary = await summarize();
    const days = [];
    for(let i = 0; i < REVIEW_DAYS; i++){
      const key = startOfDay(Date.now() - (REVIEW_DAYS - 1 - i) * 86_400_000);
      const b = summary?.byDay.get(key) ?? emptyBucket();
      days.push({ key, wake:mean(b.wake, b.wakeN), smile:mean(b.smile, b.smileN), sec:b.sec });
    }
    const hours = (summary?.byHour ?? Array.from({ length:24 }, emptyBucket)).map((b, hour) => ({
      hour,
      wake: b.sec >= HOUR_MIN_SEC ? mean(b.wake, b.wakeN) : null,
      smile:b.sec >= HOUR_MIN_SEC ? mean(b.smile, b.smileN) : null,
      sec:  b.sec
    }));

    charts.day.items = days;
    charts.hour.items = hours;
    drawChart("day");
    drawChart("hour");
    labelDayAxis(days);
    reviewSummary.textContent = describeReview(days, hours);
  }finally{
    reviewBtn.disabled = false;
  }
}

function describeReview(days, hours){
  const sec = days.reduce((a, d) => a + d.sec, 0);
  if(!sec) return "まだ振り返るだけの記録がありません。しばらく見守ると、ここに日ごとと時間帯別の傾向が出ます。";

  const wake  = weighted(days, "wake");
  const smile = weighted(days, "smile");
  const parts = [`直近 ${REVIEW_DAYS} 日で ${duration(sec)} を計測しました。`];

  if(wake !== null && smile !== null){
    parts.push(`平均は覚醒 ${Math.round(wake)}、笑顔 ${Math.round(smile)} です。`);
  }else if(wake !== null){
    parts.push(`平均は覚醒 ${Math.round(wake)} です。`);
  }

  // 時間帯を比べるには、比べられるだけの時間帯が要る
  const scored = hours.filter(h => h.wake !== null);
  if(scored.length >= 3){
    const worst = scored.reduce((a, b) => (b.wake < a.wake ? b : a));
    parts.push(`いちばん下がるのは ${worst.hour} 時台（覚醒 ${Math.round(worst.wake)}）です。`);
  }
  return parts.join("");
}

function weighted(days, key){
  let sum = 0, n = 0;
  for(const d of days){
    if(d[key] === null) continue;
    sum += d[key] * d.sec;
    n += d.sec;
  }
  return n ? sum / n : null;
}

function duration(sec){
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  return h ? `${h} 時間 ${m} 分` : `${m} 分`;
}

function labelDayAxis(days){
  const label = ms => { const d = new Date(ms); return `${d.getMonth() + 1}/${d.getDate()}`; };
  const picks = [days[0], days[Math.floor(days.length / 2)], days[days.length - 1]];
  dayAxis.replaceChildren(...picks.map(d => {
    const span = document.createElement("span");
    span.textContent = label(d.key);
    return span;
  }));
}

// 1 区画に覚醒と笑顔を並べて描く。
// リボンは「色＝スコアの高さ」だが、こちらは 2 系列を見比べる図なので、
// 高さだけで値を表し、色は凡例と同じ単色にする。
const CHART_WAKE  = "#3E8E7E";
const CHART_SMILE = "#F0A93B";

function drawChart(key){
  const c = charts[key];
  const rect = c.canvas.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  c.ctx.clearRect(0, 0, w, h);
  c.ctx.fillStyle = "#E9E6F0";
  c.ctx.fillRect(0, 0, w, h);
  if(!c.items.length) return;

  const slot = w / c.items.length;
  const gap = Math.min(3, slot * 0.18);
  const barW = Math.max(1.5, (slot - gap) / 2);

  const bar = (x, value, color) => {
    if(value === null){
      c.ctx.fillStyle = "#DCD8E4";
      c.ctx.fillRect(x, h / 2 - 1, Math.max(1, barW - 0.5), 2);
      return;
    }
    const height = Math.max(2, (value / 100) * h);
    c.ctx.fillStyle = color;
    c.ctx.fillRect(x, h - height, Math.max(1, barW - 0.5), height);
  };

  c.items.forEach((item, i) => {
    const x = i * slot + gap / 2;
    bar(x, item.wake, CHART_WAKE);
    bar(x + barW, item.smile, CHART_SMILE);
  });
}

/* ---------- 表示 ---------- */
function totalRows(){ return stored.rows + pendingRows.length; }

function updateRecordUi(){
  const total = totalRows();
  logCount.textContent = total ? `${total.toLocaleString("ja-JP")} 件${periodLabel()}` : "0 件";
  const empty = total === 0;
  csvBtn.disabled = empty;
  jsonBtn.disabled = empty;
  clearBtn.disabled = empty;
}

function periodLabel(){
  const from = stored.from ?? pendingRows[0]?.epochMs ?? null;
  const to   = pendingRows.length ? pendingRows[pendingRows.length - 1].epochMs : stored.to;
  if(from === null || to === null) return "";
  const day = ms => { const d = new Date(ms); return `${d.getMonth() + 1}/${d.getDate()}`; };
  return day(from) === day(to) ? `（${day(from)}）` : `（${day(from)}〜${day(to)}）`;
}

const CSV_HEADERS = [
  ["session",  "セッション"],
  ["time",     "記録時刻"],
  ["elapsed",  "経過秒"],
  ["face",     "顔検出"],
  ["smile",    "笑顔スコア"],
  ["smileAvg", "笑顔スコア_1分平均"],
  ["wake",     "覚醒スコア"],
  ["perclos",  "PERCLOS"],
  ["fluct",    "開瞼ゆらぎ"],
  ["asym",     "左右差"],
  ["eyeOpen",  "平均開瞼度"]
];

// 書き出す範囲の始まり。null なら全期間
function rangeStart(){
  const v = exportRange.value;
  if(v === "all") return null;
  if(v === "today"){
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }
  return Date.now() - Number(v) * 86_400_000;
}

// 保存済みと書き込み待ちを合わせて、時刻順に取り出す
async function collect(){
  await flush();
  const from = rangeStart();
  const within = x => from === null || x.epochMs >= from;
  const rows   = (await readSince("samples", from)).concat(pendingRows.filter(within));
  const events = (await readSince("events",  from)).concat(pendingEvents.filter(within));
  rows.sort((a, b) => a.epochMs - b.epochMs);
  events.sort((a, b) => a.epochMs - b.epochMs);
  return { rows, events };
}

async function withBusy(button, task){
  const label = button.textContent;
  button.disabled = true;
  button.textContent = "書き出し中…";
  try{ await task(); }
  finally{
    button.textContent = label;
    updateRecordUi();
  }
}

function exportCsv(){
  return withBusy(csvBtn, async () => {
    const { rows } = await collect();
    writeCsv(rows);
  });
}

function writeCsv(rows){
  const lines = [CSV_HEADERS.map(h => h[1]).join(",")];
  for(const r of rows){
    lines.push([
      r.session,
      localTime(r.epochMs),
      r.elapsed,
      r.face ? 1 : 0,
      cell(r.smile), cell(r.smileAvg), cell(r.wake),
      cell(r.perclos), cell(r.fluct), cell(r.asym), cell(r.eyeOpen)
    ].join(","));
  }
  // Excel が UTF-8 と判別できるよう BOM を付ける（不可視文字なのでエスケープで書く）
  download(`smile-watch-${stamp()}.csv`, "\uFEFF" + lines.join("\r\n") + "\r\n", "text/csv;charset=utf-8");
}

function exportJson(){
  return withBusy(jsonBtn, async () => {
    const { rows, events } = await collect();
    writeJson(rows, events);
  });
}

function writeJson(rows, events){
  const payload = {
    app:"笑顔ウォッチ",
    version:APP_VERSION,
    exportedAt:new Date().toISOString(),
    range:exportRange.options[exportRange.selectedIndex].textContent,
    settings:{
      sampleMs:SAMPLE_MS,
      windowMs:WINDOW_MS,
      retentionDays:RETENTION_DAYS,
      smileThreshold:Number(smileThreshold.value),
      wakeThreshold:Number(wakeThreshold.value),
      durationSec:Number(durationInput.value),
      cooldownMs:COOLDOWN_MS,
      baseline
    },
    fields:{
      session:"見守りの開始ごとに増える通し番号",
      epochMs:"記録時刻（UNIX ミリ秒）",
      elapsed:"そのセッションの開始からの経過秒",
      face:"その1秒に顔を検出できたか",
      smile:"その1秒の笑顔スコア平均（0-100）",
      smileAvg:"直近60秒の笑顔スコア平均（0-100）",
      wake:"直近60秒から求めた覚醒スコア（0-100）",
      perclos:"直近60秒で開瞼度が0.2未満だったサンプルの割合",
      fluct:"開瞼中サンプルの開瞼度の標準偏差（時間的ゆらぎ）",
      asym:"開瞼中サンプルの左右開瞼度の差の平均（左右差）",
      eyeOpen:"直近60秒の平均開瞼度（0-1、1=全開）"
    },
    events,
    samples:rows
  };
  download(`smile-watch-${stamp()}.json`, JSON.stringify(payload, null, 2), "application/json");
}

async function clearLog(){
  if(!confirm(`記録 ${totalRows().toLocaleString("ja-JP")} 件をすべて消します。元に戻せません。`)) return;
  clearTimeout(flushTimer);
  flushTimer = null;
  pendingRows = [];
  pendingEvents = [];
  if(db){
    try{
      const t = db.transaction(["samples", "events"], "readwrite");
      t.objectStore("samples").clear();
      t.objectStore("events").clear();
      await settled(t);
    }catch{ /* 消せなければ件数表示だけずれる。次の起動で揃う */ }
  }
  stored = { rows:0, from:null, to:null };
  // 見守り中に消すと現在セッションの start も消えてしまい、以後の行が
  // 開始イベントのないまま書き出される。境界を入れ直して履歴を保つ。
  if(running) addEvent(performance.now(), "start", { session:sessionNo, afterClear:true });
  updateRecordUi();
  await refreshReview();
}

function download(filename, text, mime){
  const url = URL.createObjectURL(new Blob([text], { type:mime }));
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function cell(v){ return v === null || v === undefined ? "" : v; }

function localTime(ms){
  const d = new Date(ms);
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function stamp(){
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

/* ---------- 表示 ---------- */
function showMetrics(m){
  perclosOut.firstChild.textContent = m ? (m.perclos * 100).toFixed(1) + "%" : "--";
  fluctOut.firstChild.textContent   = m && m.fluct !== null ? m.fluct.toFixed(3) : "--";
  asymOut.firstChild.textContent    = m && m.asym  !== null ? m.asym.toFixed(3)  : "--";
}

function showBaseline(){
  const b = baseline;
  perclosBase.textContent = "基準 " + (b ? (b.perclos * 100).toFixed(1) + "%" : "--");
  fluctBase.textContent   = "基準 " + (b ? b.fluct.toFixed(3) : "--");
  asymBase.textContent    = "基準 " + (b ? b.asym.toFixed(3)  : "--");
}

function pushColumn(key, value){
  const r = ribbons[key];
  r.columns.push(value === undefined ? null : value);
  trimColumns(key);
}

function fitCanvas(canvas, ctx){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.round(rect.width * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function resizeAll(){
  for(const key of Object.keys(ribbons)){
    const r = ribbons[key];
    fitCanvas(r.canvas, r.ctx);
    trimColumns(key);
    drawRibbon(key);
  }
  for(const key of Object.keys(charts)){
    fitCanvas(charts[key].canvas, charts[key].ctx);
    drawChart(key);
  }
}

function trimColumns(key){
  const r = ribbons[key];
  const max = Math.max(1, Math.floor(r.canvas.getBoundingClientRect().width / COL_W));
  if(r.columns.length > max) r.columns = r.columns.slice(r.columns.length - max);
}

function drawRibbon(key){
  const r = ribbons[key];
  const rect = r.canvas.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  r.ctx.clearRect(0, 0, w, h);
  r.ctx.fillStyle = "#E9E6F0";
  r.ctx.fillRect(0, 0, w, h);
  r.columns.forEach((value, i) => {
    const x = w - (r.columns.length - i) * COL_W;
    if(value === null){
      r.ctx.fillStyle = "#DCD8E4";
      r.ctx.fillRect(x, h/2 - 1, COL_W - 1, 2);
    }else{
      const bar = Math.max(3, (value / 100) * h);
      r.ctx.fillStyle = r.color(value);
      r.ctx.fillRect(x, h - bar, COL_W - 1, bar);
    }
  });
}

// 笑顔: 低い＝青紫(110,99,166) → 高い＝山吹(240,169,59)
function smileColor(value){
  return mix([110,99,166], [240,169,59], Math.min(1, value / 70));
}

// 覚醒: 低い＝赤茶(196,87,78) → 高い＝青緑(62,142,126)
function wakeColor(value){
  return mix([196,87,78], [62,142,126], clamp(value / 100, 0, 1));
}

function mix(a, b, k){
  const c = a.map((v, i) => Math.round(v + (b[i] - v) * k));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

/* ---------- 補助 ---------- */
function average(list){
  const valid = list.filter(v => typeof v === "number" && !Number.isNaN(v));
  if(!valid.length) return null;
  return valid.reduce((a, b) => a + b, 0) / valid.length;
}

function stdev(list){
  if(list.length < 2) return null;
  const mean = list.reduce((a, b) => a + b, 0) / list.length;
  const variance = list.reduce((a, v) => a + (v - mean) ** 2, 0) / list.length;
  return Math.sqrt(variance);
}

function clamp(v, lo, hi){ return v < lo ? lo : v > hi ? hi : v; }

function round(v, digits){
  if(v === null || v === undefined) return null;
  const f = 10 ** digits;
  return Math.round(v * f) / f;
}

function setStatus(kind, text){
  dot.className = "dot" + (kind ? " " + kind : "");
  statusText.textContent = text;
}

function describeError(err){
  const name = err?.name || "";
  if(name === "NotAllowedError") return "カメラの使用が許可されていません。アドレスバーのカメラアイコンから許可して、もう一度お試しください。";
  if(name === "NotFoundError")   return "カメラが見つかりません。内蔵カメラまたは外付けカメラを接続してください。";
  if(location.protocol === "file:") return "file:// ではカメラを使えません。ターミナルで python3 -m http.server 8000 を実行し、http://localhost:8000/smile-watch.html を開いてください。";
  return "解析モデルを読み込めませんでした。ネットワーク接続を確認して、もう一度お試しください。";
}
